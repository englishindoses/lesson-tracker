<!doctype html>
<html
  lang="en"
  data-palette="neon"
  data-fonts="sketch"
  data-paper="dots"
  data-edges="hand"
>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Lesson Tracker</title>
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      // Deliberately dumb: it trusts what it reads and lets the app correct it
      // a moment later, rather than repeating the validation from theme.ts.
      //
      // Settings belong to the account, but the account isn't known until auth
      // resolves -- far too late to paint. So we use the last account signed in
      // on this device as the guess, and fall back to the default look, which
      // is also what the sign-in page is meant to wear.
      try {
        var root = document.documentElement
        // Keep in step with the whimsical preset in theme.ts.
        var DEFAULT = { palette: 'neon', fonts: 'sketch', paper: 'dots', edges: 'hand' }
        var p = {}
        var uid = localStorage.getItem('lt.lastUser')
        if (uid) {
          var mirror = JSON.parse(localStorage.getItem('lt.prefs.' + uid) || 'null')
          p = (mirror && mirror.data) || {}
        }
        var t = p.theme
        if (!t) {
          // Older versions stored one theme name. Map it to the four choices.
          var map = {
            cozy: { palette: 'peach', fonts: 'script', paper: 'dots', edges: 'hand' },
            whimsical: { palette: 'neon', fonts: 'sketch', paper: 'dots', edges: 'hand' },
            modern: { palette: 'slate', fonts: 'system', paper: 'plain', edges: 'clean' },
          }
          t = map[p.style]
        }
        if (!t) t = DEFAULT
        root.dataset.palette = t.palette || DEFAULT.palette
        root.dataset.fonts = t.fonts || DEFAULT.fonts
        root.dataset.paper = t.paper || DEFAULT.paper
        root.dataset.edges = t.edges || DEFAULT.edges

        var m = p.mode || 'system'
        var dark =
          m === 'dark' ||
          (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        root.dataset.mode = dark ? 'dark' : 'light'
        root.lang = p.lang === 'pt' ? 'pt-BR' : 'en'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
