<!doctype html>
<html lang="en" data-style="ink">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Lesson Tracker</title>
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      try {
        var s = localStorage.getItem('lt.style') || 'ink'
        var m = localStorage.getItem('lt.mode') || 'system'
        var dark =
          m === 'dark' ||
          (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.style = s
        document.documentElement.dataset.mode = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
